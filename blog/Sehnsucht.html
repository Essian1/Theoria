<h1>Sehnsucht</h1>
<p>Only those who know this longing
Know what I suffer!
Alone and cut off 
From every joy, I search the sky 
In that direction.
Ah! he who loves and knows me 
Is far away.
My head reels, 
My body blazes.

Only those who know this longing
Know what I suffer!</p>

- Essian
